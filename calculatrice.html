<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Calculatrice - Frantz EKOKO</title>
<style>body{background:#0d1117;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.calc{background:#161b22;padding:20px;border-radius:15px;box-shadow:0 0 20px #58a6ff;width:280px}#screen{width:100%;height:50px;font-size:28px;text-align:right;margin-bottom:15px;border-radius:8px;border:none;padding:10px;box-sizing:border-box}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:50px;font-size:20px;border:none;border-radius:8px;background:#21262d;color:white}button.op{background:#238636}button.eq{background:#58a6ff}</style></head><body>
<div class="calc"><input id="screen" disabled><div class="btns">
<button onclick="c('7')">7</button><button onclick="c('8')">8</button><button onclick="c('9')">9</button><button class="op" onclick="c('/')">/</button>
<button onclick="c('4')">4</button><button onclick="c('5')">5</button><button onclick="c('6')">6</button><button class="op" onclick="c('*')">x</button>
<button onclick="c('1')">1</button><button onclick="c('2')">2</button><button onclick="c('3')">3</button><button class="op" onclick="c('-')">-</button>
<button onclick="c('0')">0</button><button onclick="c('.')">.</button><button class="eq" onclick="e()">=</button><button class="op" onclick="c('+')">+</button>
<button onclick="cl()" style="grid-column:span 4;background:#da3633">CLEAR</button>
</div></div><script>let s=document.getElementById('screen');function c(v){s.value+=v}function cl(){s.value=''}function e(){try{s.value=eval(s.value)}catch{s.value='Erreur'}}</script></body></html>
